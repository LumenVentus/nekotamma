    function calculateNameStrokes(nameStr) {
        const chars = Array.from(nameStr);
        let total = 0;
        let prevStroke = 0;
        const unknownChars = [];

        for (let i = 0; i < chars.length; i++) {
            const ch = chars[i];
            if (ch === '々' || ch === 'ゝ' || ch === 'ゞ' || ch === 'ヽ' || ch === 'ヾ') {
                if (prevStroke === 0) {
                    return { error: `先頭に踊り字「${ch}」は使用できません。` };
                }
                total += prevStroke;
            } else {
                const s = strokeMap[ch];
                if (typeof s !== 'number') {
                    unknownChars.push(ch);
                } else {

                    prevStroke = s;

        return (hash >>> 0);
