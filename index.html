    function resolveKanaStroke(ch) {
        if (Object.prototype.hasOwnProperty.call(KANA_BASE, ch)) {
            return KANA_BASE[ch];

        const nfd = ch.normalize('NFD');
        if (nfd.length > 1 && Object.prototype.hasOwnProperty.call(KANA_BASE, nfd)) {

            }
            return total;
        }
