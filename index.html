        .secure-fortress { max-width: 500px; width: 100%; background: #0f172a; padding: 30px; border-radius: 12px; border: 2px solid #0ea5e9; box-shadow: 0 0 24px rgba(14, 165, 233, 0.25); box-sizing: border-box; }

        input { width: 100%; padding: 12px; background: #020617; border: 1px solid #334155; border-radius: 6px; color: #ffffff; font-size: 16px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #0ea5e9; }
        button { width: 100%; padding: 14px; background: #0ea5e9; color: #ffffff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #38bdf8; }
        .counter-monitor { margin-top: 20px; padding: 12px; background: #020617; border-radius: 6px; border: 1px solid #1e293b; font-family: monospace; font-size: 13px; text-align: center; color: #38bdf8; }
        .output-panel { margin-top: 20px; padding: 18px; background: #1e293b; border-radius: 6px; display: none; border-left: 4px solid #0ea5e9; }
        .error-panel { margin-top: 15px; padding: 12px; background: #450a0a; border: 1px solid #ef4444; border-radius: 6px; color: #fca5a5; font-size: 13px; display: none; }
    </style>
</head>

    <div class="input-block">

        <input type="text" id="nodeLastName" autocomplete="off" spellcheck="false" maxlength="15" placeholder="例：徳永">
    </div>
    <div class="input-block">
        <label for="nodeFirstName">名前（漢字・ひらがな・カタカナ）</label>
        <input type="text" id="nodeFirstName" autocomplete="off" spellcheck="false" maxlength="15" placeholder="例：朱美">
    </div>
    <div class="input-block">
        <label for="nodeBirthday">生年月日</label>
        <input type="date" id="nodeBirthday" min="1900-01-01" max="2099-12-31">
    </div>
    
    <button id="execBtn" type="button">占ってみる</button>

    <div id="errorBox" class="error-panel" role="alert"></div>

    <div class="counter-monitor">
        📊 占い実行累計数: <strong id="execCounter">0</strong> 回
    </div>

    <div id="secureOutput" class="output-panel">

        <p id="outMeta" style="font-weight: bold; color: #e2e8f0; margin: 0 0 10px 0;"></p>
        <p id="outDesc" style="color: #cbd5e1; line-height: 1.7; margin: 0; font-size: 14px;"></p>
    </div>
</div>
